<!doctype html>
<html lang="bn" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="বাজার">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>বাজারের তালিকা</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@700;800&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--sf:#F5F8F4;--ink:#12382A;--mute:#55675B;--line:#E2E9E0;--g:#14513A;--gs:#E3F0DF;--gold:#F2A900;--ongold:#2A1D00;--red:#A3261C;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 'Noto Sans Bengali','Kalpurush','Nirmala UI',system-ui,sans-serif;padding-bottom:150px}
button,input{font:inherit;color:inherit;cursor:pointer}input{cursor:text}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.w{max-width:480px;margin:0 auto;padding:0 18px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;padding-top:22px}
.dt{font-size:14px;font-weight:600;color:var(--mute)}
h1{font:800 34px/1.15 'Anek Bangla','Noto Sans Bengali',sans-serif;margin:4px 0 0}
.ib{width:48px;height:48px;border-radius:16px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;flex:none}
.seg{display:flex;gap:6px;padding:5px;background:var(--sf);border-radius:20px;margin:16px 0 12px}
.seg button{flex:1;height:48px;border:0;border-radius:15px;background:transparent;font-weight:700;font-size:17px}
.seg button[aria-pressed=true]{background:var(--g);color:#fff}
.sr{display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;background:#fff;border:2px solid var(--line);border-radius:18px}
.sr:focus-within{border-color:var(--g)}.sr input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;outline:0}
.ch{display:flex;gap:8px;margin:14px -18px 0;padding:0 18px;overflow-x:auto;scrollbar-width:none}
.c{flex:none;height:44px;padding:0 18px;border-radius:22px;border:2px solid var(--line);background:#fff;font-weight:600}
.c[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff;font-weight:700}
.addn{width:100%;height:52px;margin-top:12px;border-radius:16px;border:2px dashed var(--g);background:transparent;color:var(--g);font-weight:800}
.hint{color:var(--mute);font-size:14px;margin:12px 2px 0}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 12px;margin-top:22px}
.t{position:relative;height:124px;padding:0;border-radius:24px;background:#fff;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:16px;line-height:1.15;text-align:center}
.t small{font-weight:400;font-size:13px;color:var(--mute)}.t.on{background:var(--gs);border-color:var(--g)}
.sw{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink)}
.bd{position:absolute;top:-9px;right:-6px;min-width:32px;height:32px;padding:0 8px;border-radius:16px;background:var(--gold);color:var(--ongold);font-weight:800;display:grid;place-items:center}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:480px;margin:0 auto;display:flex;gap:10px}
.go{flex:1;height:60px;border:0;border-radius:20px;background:var(--g);color:#fff;font-weight:800;font-size:18px;line-height:1.1}
.go small{display:block;font-size:13px;font-weight:600;color:#C6E4D2;margin-top:2px}.go:disabled{background:#B9C7BE;cursor:default}
.sq{width:60px;height:60px;border:0;border-radius:20px;display:grid;place-items:center;flex:none}
.wa{background:#25D366;color:#05260F}.cl{background:#fff;border:2px solid var(--line);color:var(--ink)}
.cap{display:flex;justify-content:space-between;margin:18px 4px 6px;font-size:15px;color:var(--mute)}
.pg{height:12px;border-radius:6px;background:var(--sf);overflow:hidden}.pg div{height:100%;background:var(--gold);transition:width .3s}
h3{margin:18px 4px 8px;font-size:14px;color:var(--mute);font-weight:600}
.r{display:flex;align-items:center;gap:12px;min-height:76px;padding:8px 12px;border-radius:22px;margin-bottom:8px;background:var(--sf);border:2px solid var(--line)}
.k{width:44px;height:44px;border-radius:14px;border:3px solid var(--gold);background:#fff;display:grid;place-items:center;padding:0;flex:none;color:var(--ongold)}
.r.d{background:#fff}.r.d .k{background:var(--gold)}.r.d .n{opacity:.55;text-decoration:line-through}
.r .sw{width:40px;height:40px}.n{flex:1;min-width:0;line-height:1.25}.n b{font-size:19px}.n small{display:block;color:var(--mute);font-size:14px}
.pr{width:84px;height:44px;border-radius:14px;border:2px dashed #B9C7BE;background:#fff;text-align:center;font-weight:800;min-width:0}
.tot{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:456px;margin:0 auto;background:var(--gold);color:var(--ongold);border-radius:24px;min-height:72px;display:flex;align-items:center;justify-content:space-between;padding:8px 10px 8px 22px;box-shadow:0 6px 20px rgba(18,56,42,.18)}
.tot small{display:block;font-size:14px;font-weight:600}.tot b{font:800 28px 'Anek Bangla',sans-serif}
.tot button{height:50px;padding:0 20px;border:0;border-radius:16px;background:var(--ink);color:#fff;font-weight:800}
.dim{position:fixed;inset:0;background:rgba(18,56,42,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sh{width:100%;max-width:480px;background:#fff;border-radius:30px 30px 0 0;padding:12px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}@media (prefers-reduced-motion:reduce){.sh{animation:none}}
.hdl{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.top{display:flex;align-items:center;gap:14px}.top .sw{width:60px;height:60px}.top b{font:800 28px/1.1 'Anek Bangla',sans-serif;display:block}.top small{color:var(--mute);font-size:15px}
.big{display:flex;align-items:center;justify-content:space-between;background:var(--gs);border-radius:28px;padding:14px}
.big button{width:72px;height:72px;border-radius:50%;border:3px solid var(--g);background:var(--g);color:#fff;font-size:40px;line-height:1}.big .mm{background:transparent;color:var(--g)}
.big div{text-align:center;font:800 60px/1 'Anek Bangla',sans-serif}.big small{display:block;font:600 17px 'Noto Sans Bengali',sans-serif;color:var(--mute);margin-top:4px}
.us{display:flex;gap:8px;flex-wrap:wrap}.us .c{height:42px;padding:0 14px}
.pl{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 16px;border:2px dashed #B9C7BE;border-radius:18px;font-weight:600}
.pl input{width:100px;height:40px;border:0;border-radius:12px;background:var(--sf);text-align:center;font-weight:800}
.btn{height:56px;border:0;border-radius:20px;background:var(--g);color:#fff;font-weight:800;font-size:18px}
.rm{height:56px;padding:0 10px;border:0;background:none;color:var(--red);font-weight:700}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:9;max-width:90%;text-align:center}
.em{text-align:center;color:var(--mute);padding:48px 12px}
.upd{position:fixed;top:0;left:0;right:0;z-index:8;background:var(--gold);color:var(--ongold);display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;font-weight:800;font-size:16px}
.upd span{flex:1;min-width:0}.upd button{min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--ongold);color:var(--gold);font-weight:800}.upd button.x{background:transparent;color:var(--ongold);padding:0 10px;font-size:20px}
body.hasupd{padding-top:72px}
.ft{margin:36px 2px 0;padding-top:16px;border-top:1px solid var(--line);color:var(--mute);font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ft .c{height:40px;padding:0 14px;font-size:14px}.ftm{margin:6px 2px 0;font-size:14px;color:var(--mute);min-height:1.4em}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="upd" id="upd" hidden role="status"><span>নতুন আপডেট এসেছে</span><button id="updGo">এখনই নিন</button><button class="x" id="updX" aria-label="পরে">✕</button></div>
<div class="w">
  <div class="hd"><div><div class="dt" id="dt"></div><h1 id="h1">আজ বাজারে<br>কী লাগবে?</h1></div>
  <button class="ib" id="rs" aria-label="নতুন করে শুরু"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg></button></div>
  <div class="seg"><button id="t1" aria-pressed="true">তালিকা বানান</button><button id="t2" aria-pressed="false">বাজারে</button></div>
  <section id="v1">
    <label class="sr"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" aria-label="খুঁজুন" placeholder="জিনিস খুঁজুন বা নতুন লিখুন" autocomplete="off"></label>
    <div id="add"></div>
    <div class="ch" id="chips"></div>
    <p class="hint">ট্যাপ করলে তালিকায় যোগ হবে। আবার ট্যাপ করলে পরিমাণ ও একক বদলানো যাবে।</p>
    <div class="g" id="grid"></div>
  </section>
  <section id="v2" hidden><div id="shop"></div></section>
  <div class="ft"><span id="verTxt">ভার্সন —</span><button class="c" id="updBtn">আপডেট খুঁজুন</button></div>
  <p class="ftm" id="updMsg" aria-live="polite"></p>
</div>
<div class="bar" id="bar"><div><button class="go" id="gob"></button>
  <button class="sq wa" id="share" aria-label="WhatsApp-এ পাঠান"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg></button>
  <button class="sq cl" id="clr" aria-label="সব মুছুন"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button></div></div>
<div class="tot" id="tot" hidden></div>
<div class="dim" id="dim" hidden><div class="sh" id="sh" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden role="status"></div>
<script>
var BN="০১২৩৪৫৬৭৮৯";
function $(i){return document.getElementById(i)}
function bn(n){return String(n).replace(/\d/g,function(d){return BN[d]})}
function qt(q){var w=Math.floor(q),f=+(q-w).toFixed(2);if(!f)return bn(w);if(f===.5)return(w?bn(w):"")+"½";return bn(q)}
function num(s){s=String(s).replace(/[০-৯]/g,function(d){return BN.indexOf(d)});var v=parseFloat(s);return isFinite(v)?v:0}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var GL={
 root:'<path d="M12 4c1 2 5 5 5 9a5 5 0 0 1-10 0c0-4 4-7 5-9z"/>',
 veg:'<path d="M5 19c0-8 5-14 14-14 0 9-6 14-14 14zM5 19l8-8"/>',
 grain:'<path d="M4 11h16a8 8 0 0 1-16 0zM8 7c0-2 2-2 2-4M14 7c0-2 2-2 2-4"/>',
 drop:'<path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/>',
 spice:'<path d="M6 5c6-2 12 2 11 9-.5 3-2 5-4 6 2-5 0-9-7-15z"/>',
 fruit:'<circle cx="12" cy="13" r="7"/><path d="M9 6l3 2 3-2"/>',
 own:'<path d="M12 5v14M5 12h14"/>'};
var CATS=[
["মূল সবজি","#F8D9DF","root","পেঁয়াজ|কেজি;রসুন|কেজি;আদা|কেজি;আলু|কেজি;কাঁচা মরিচ|কেজি;টমেটো|কেজি;বেগুন|কেজি;ধনেপাতা|আঁটি"],
["সবজি","#D3EBBF","veg","লাউ|পিস;পটল|কেজি;ফুলকপি|পিস;বাঁধাকপি|পিস;গাজর|কেজি;শসা|কেজি;করলা|কেজি;বরবটি|কেজি"],
["শাক","#BFE3C9","veg","পালং শাক|আঁটি;লাল শাক|আঁটি;পুঁই শাক|আঁটি;কলমি শাক|আঁটি"],
["চাল-ডাল","#F6E3A8","grain","মিনিকেট চাল|কেজি;মোটা চাল|কেজি;আটা|কেজি;ময়দা|কেজি;মসুর ডাল|কেজি;মুগ ডাল|কেজি;ছোলার ডাল|কেজি;সেমাই|প্যাকেট"],
["তেল-রান্না","#FBEFB0","drop","সয়াবিন তেল|লিটার;সরিষার তেল|লিটার;ঘি|প্যাকেট;লবণ|কেজি;চিনি|কেজি;গুড়|কেজি"],
["মসলা","#F9C9B8","spice","হলুদ গুঁড়া|প্যাকেট;মরিচ গুঁড়া|প্যাকেট;ধনে গুঁড়া|প্যাকেট;জিরা|প্যাকেট;এলাচ|প্যাকেট;দারুচিনি|প্যাকেট;তেজপাতা|প্যাকেট;গোলমরিচ|প্যাকেট"],
["ফল","#F7C9C0","fruit","কলা|হালি;পেঁপে|কেজি;আপেল|কেজি;কমলা|কেজি;আম|কেজি;লেবু|হালি;পেয়ারা|কেজি;আঙুর|কেজি"]];
var UNITS=["কেজি","গ্রাম","লিটার","পিস","হালি","আঁটি","প্যাকেট"];
var S={mode:1,cat:0,q:"",items:{},custom:[],sel:null};
try{var sv=JSON.parse(localStorage.getItem("bazar-v2")||"null");if(sv){S.items=sv.items||{};S.custom=sv.custom||[];S.mode=sv.mode||1}}catch(e){}
function save(){try{localStorage.setItem("bazar-v2",JSON.stringify({items:S.items,custom:S.custom,mode:S.mode}))}catch(e){}}
function cats(){var a=CATS.map(function(c){return{n:c[0],c:c[1],g:c[2],l:c[3].split(";").map(function(x){return x.split("|")})}});
 if(S.custom.length)a.push({n:"আমার যোগ করা",c:"#E4E9E2",g:"own",l:S.custom});return a}
function info(name){var a=cats();for(var i=0;i<a.length;i++)for(var j=0;j<a[i].l.length;j++)if(a[i].l[j][0]===name)return{c:a[i].c,g:a[i].g,u:a[i].l[j][1]};return{c:"#E4E9E2",g:"own",u:"পিস"}}
function sw(c,g){return'<span class="sw" style="background:'+c+'"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">'+GL[g]+'</svg></span>'}
function names(){return Object.keys(S.items)}
function toast(m){var t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},1800)}
function step(u){return u==="কেজি"||u==="লিটার"?.5:u==="গ্রাম"?50:1}
function render(){
 var n=names().length,A=cats(),m=S.mode;
 $("t1").setAttribute("aria-pressed",m===1);$("t2").setAttribute("aria-pressed",m===2);
 $("v1").hidden=m!==1;$("v2").hidden=m!==2;$("bar").hidden=m!==1;$("tot").hidden=m!==2;
 $("h1").innerHTML=m===1?"আজ বাজারে<br>কী লাগবে?":"বাজারে আছি";
 var est=0;names().forEach(function(k){est+=num(S.items[k].p)});
 $("gob").innerHTML="বাজারে যান · "+bn(n)+"টি"+(est?"<small>আনুমানিক ৳"+bn(est)+"</small>":"");$("gob").disabled=!n;
 if(m===1){
  var q=S.q.trim(),h='<button class="c" aria-pressed="'+(S.cat===-1)+'" data-c="-1">সব</button>';
  A.forEach(function(c,i){h+='<button class="c" aria-pressed="'+(S.cat===i)+'" data-c="'+i+'">'+esc(c.n)+'</button>'});
  $("chips").innerHTML=h;
  var g="",found=false;
  A.forEach(function(c,i){if(!q&&S.cat!==-1&&S.cat!==i)return;
   c.l.forEach(function(x){if(q&&x[0].indexOf(q)<0)return;found=true;var it=S.items[x[0]];
    g+='<button class="t'+(it?" on":"")+'" data-n="'+esc(x[0])+'">'+(it?'<span class="bd">'+qt(it.q)+'</span>':'')+sw(c.c,c.g)+'<span>'+esc(x[0])+'</span><small>'+esc(it?it.u:x[1])+'</small></button>'})});
  $("grid").innerHTML=g;
  var exact=A.some(function(c){return c.l.some(function(x){return x[0]===q})});
  $("add").innerHTML=q&&!exact?'<button class="addn" data-new="1">+ “'+esc(q)+'” নতুন যোগ করুন</button>':"";
 }else{
  if(!n){$("shop").innerHTML='<p class="em">তালিকা খালি। আগে “তালিকা বানান” থেকে জিনিস যোগ করুন।</p>';$("tot").hidden=true;return}
  var d=0,spent=0,out='';names().forEach(function(k){var it=S.items[k];if(it.d)d++;spent+=it.d?num(it.p):0});
  out+='<div class="cap"><span>'+bn(d)+' / '+bn(n)+' কেনা হয়েছে</span><span>'+(n-d?'আর '+bn(n-d)+'টি বাকি':'সব কেনা শেষ')+'</span></div><div class="pg"><div style="width:'+(d/n*100)+'%"></div></div>';
  A.forEach(function(c){var rows=c.l.filter(function(x){return S.items[x[0]]});if(!rows.length)return;
   out+='<h3>'+esc(c.n)+'</h3>';
   rows.forEach(function(x){var it=S.items[x[0]];
    out+='<div class="r'+(it.d?" d":"")+'">'+'<button class="k" data-k="'+esc(x[0])+'" aria-pressed="'+!!it.d+'" aria-label="'+esc(x[0])+' কেনা হয়েছে">'+(it.d?'<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:3"><path d="M5 12l5 5 9-10"/></svg>':'')+'</button>'+sw(c.c,c.g)+'<div class="n"><b>'+esc(x[0])+'</b><small>'+qt(it.q)+' '+esc(it.u)+'</small></div><input class="pr" data-p="'+esc(x[0])+'" inputmode="decimal" placeholder="৳ দাম" aria-label="'+esc(x[0])+' এর দাম" value="'+(it.p?"৳ "+bn(it.p):"")+'"></div>'})});
  $("shop").innerHTML=out;
  $("tot").innerHTML='<div><small>এখন পর্যন্ত খরচ</small><b>৳ '+bn(spent)+'</b></div><button id="fin">শেষ করুন</button>';
 }
}
function sheet(){
 var k=S.sel,dim=$("dim");if(!k||!S.items[k]){dim.hidden=true;S.sel=null;return}
 var it=S.items[k],i=info(k),h='<div class="hdl"></div><div class="top">'+sw(i.c,i.g)+'<div><b>'+esc(k)+'</b><small>তালিকায় আছে</small></div></div>';
 h+='<div class="big"><button class="mm" data-s="-1" aria-label="কমান">−</button><div>'+qt(it.q)+'<small>'+esc(it.u)+'</small></div><button data-s="1" aria-label="বাড়ান">+</button></div><div class="us">';
 UNITS.forEach(function(u){h+='<button class="c" data-u="'+u+'" aria-pressed="'+(it.u===u)+'">'+u+'</button>'});
 h+='</div><label class="pl">আনুমানিক দাম<input id="sp" inputmode="decimal" value="'+(it.p?"৳ "+bn(it.p):"")+'" placeholder="৳ —"></label>';
 h+='<div style="display:flex;gap:10px"><button class="rm" data-rm="1">সরান</button><button class="btn" style="flex:1" data-ok="1">ঠিক আছে</button></div>';
 $("sh").innerHTML=h;dim.hidden=false}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
 if(b.dataset.n){var k=b.dataset.n;if(!S.items[k]){S.items[k]={q:1,u:info(k).u};toast(k+" যোগ হয়েছে")}else S.sel=k;save();render();sheet();return}
 if(b.dataset.c){S.cat=+b.dataset.c;render();return}
 if(b.dataset.new){var nm=S.q.trim();if(!S.custom.some(function(x){return x[0]===nm}))S.custom.push([nm,"পিস"]);S.items[nm]=S.items[nm]||{q:1,u:"পিস"};S.q="";$("q").value="";save();render();return}
 if(b.dataset.s){var it=S.items[S.sel],st=step(it.u);it.q=Math.max(st,+(it.q+st*b.dataset.s).toFixed(2));save();render();sheet();return}
 if(b.dataset.u){var it2=S.items[S.sel];it2.u=b.dataset.u;if(it2.q<step(it2.u))it2.q=step(it2.u);save();render();sheet();return}
 if(b.dataset.rm){delete S.items[S.sel];S.sel=null;save();render();sheet();return}
 if(b.dataset.ok){S.sel=null;sheet();return}
 if(b.dataset.k){var x=S.items[b.dataset.k];x.d=!x.d;save();render();return}
 if(b.id==="t1"||b.id==="t2"){S.mode=b.id==="t1"?1:2;save();render();window.scrollTo(0,0);return}
 if(b.id==="gob"){S.mode=2;save();render();window.scrollTo(0,0);return}
 if(b.id==="clr"){if(names().length&&confirm("পুরো তালিকা মুছবেন?")){S.items={};save();render()}return}
 if(b.id==="rs"){names().forEach(function(k){S.items[k].d=false});S.mode=1;save();render();toast("কেনার টিক মুছে ফেলা হয়েছে");return}
 if(b.id==="fin"){names().forEach(function(k){S.items[k].d=false});S.mode=1;save();render();toast("বাজার শেষ। ধন্যবাদ!");return}
 if(b.id==="share"){var tx="বাজারের তালিকা\n"+names().map(function(k){return"• "+k+" — "+qt(S.items[k].q)+" "+S.items[k].u}).join("\n");
  if(!names().length){toast("তালিকা খালি");return}
  var w=null;try{w=window.open("https://wa.me/?text="+encodeURIComponent(tx),"_blank")}catch(er){}
  if(!w){try{navigator.clipboard.writeText(tx);toast("তালিকা কপি হয়েছে")}catch(er2){toast("পাঠানো গেল না")}}}
});
document.addEventListener("change",function(e){var t=e.target;
 if(t.dataset&&t.dataset.p){S.items[t.dataset.p].p=num(t.value)||0;save();render()}
 if(t.id==="sp"&&S.sel){S.items[S.sel].p=num(t.value)||0;save();render();sheet()}});
$("q").addEventListener("input",function(e){S.q=e.target.value;render()});
$("dim").addEventListener("click",function(e){if(e.target.id==="dim"){S.sel=null;sheet()}});
try{$("dt").textContent=new Date().toLocaleDateString("bn-BD",{weekday:"long",day:"numeric",month:"long"})}catch(e){}
render();
/* offline support + app updates */
var swReg=null,reloading=false,lastCheck=0;
function setUpd(t){var e=$("updMsg");if(e)e.textContent=t}
function showUpd(){$("upd").hidden=false;document.body.classList.add("hasupd");setUpd("নতুন ভার্সন পাওয়া গেছে — ওপরের হলুদ বারে “এখনই নিন” চাপুন")}
function askVersion(){var w=navigator.serviceWorker.controller||(swReg&&swReg.active);if(w)w.postMessage({type:"VERSION"})}
function checkUpdate(manual){
 if(!swReg){if(manual)setUpd("এই ব্রাউজারে আপডেট সুবিধা নেই");return}
 if(!navigator.onLine){if(manual)setUpd("নেট নেই — নেট এলে আবার চেষ্টা করুন");return}
 if(manual)setUpd("খোঁজা হচ্ছে…");lastCheck=Date.now();
 swReg.update().then(function(){
  if(swReg.waiting)showUpd();else if(swReg.installing){if(manual)setUpd("নতুন ভার্সন নামছে…")}else if(manual)setUpd("আপনি সর্বশেষ ভার্সনেই আছেন ✓")
 }).catch(function(){if(manual)setUpd("খোঁজা যায়নি, একটু পরে চেষ্টা করুন")})}
if("serviceWorker" in navigator){
 navigator.serviceWorker.addEventListener("message",function(e){var d=e.data||{};if(d.type==="VERSION"){var n=String(d.v).replace(/\D/g,"");$("verTxt").textContent="ভার্সন "+(n?bn(n):"—")}});
 navigator.serviceWorker.addEventListener("controllerchange",function(){if(reloading)location.reload()});
 window.addEventListener("load",function(){
  navigator.serviceWorker.register("sw.js").then(function(reg){
   swReg=reg;if(reg.waiting&&navigator.serviceWorker.controller)showUpd();
   reg.addEventListener("updatefound",function(){var w=reg.installing;if(!w)return;w.addEventListener("statechange",function(){if(w.state==="installed"&&navigator.serviceWorker.controller)showUpd()})});
   navigator.serviceWorker.ready.then(askVersion);checkUpdate(false)
  }).catch(function(){})});
 document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&Date.now()-lastCheck>300000)checkUpdate(false)});
 $("updGo").onclick=function(){reloading=true;if(swReg&&swReg.waiting)swReg.waiting.postMessage({type:"SKIP_WAITING"});else location.reload()};
 $("updX").onclick=function(){$("upd").hidden=true;document.body.classList.remove("hasupd")};
 $("updBtn").onclick=function(){checkUpdate(true)};
}else{$("updBtn").onclick=function(){setUpd("এই ব্রাউজারে আপডেট সুবিধা নেই")}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
</script>
</body>
