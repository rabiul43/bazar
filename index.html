<!DOCTYPE html>
<html lang="bn" translate="no" class="notranslate">
<head>
<meta charset="utf-8"><meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>বাজারের তালিকা</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f1;--card:#fff;--ink:#1d2a22;--mute:#4d6455;--line:#dbe4d6;--brand:#1f6b4a;--on:#fff;--sel:#e6f2ea;--gold:#f2b705;--ongold:#2a2100;--danger:#a3261c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--card:#1b261f;--ink:#e9f0ea;--mute:#a3b8aa;--line:#2b3a30;--brand:#4fb584;--on:#062314;--sel:#1d3a2a;--danger:#ff8a80}}
:root[data-theme="dark"]{--bg:#121a15;--card:#1b261f;--ink:#e9f0ea;--mute:#a3b8aa;--line:#2b3a30;--brand:#4fb584;--on:#062314;--sel:#1d3a2a;--danger:#ff8a80}
body.shop{--bg:#10261b;--card:#1a3626;--ink:#eaf3ec;--mute:#a8c4b0;--line:#2d4a38;--brand:#7fcfa0;--on:#10261b;--sel:#1d3a2a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali","Kalpurush","Nirmala UI",system-ui,sans-serif;font-size:18px;line-height:1.4;padding-bottom:130px;transition:background .25s}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.w{max-width:480px;margin:0 auto;padding:0 16px}
h1{margin:20px 0 0;font-size:28px;font-weight:800}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1;height:48px;border-radius:14px;border:2px solid var(--brand);background:transparent;color:var(--brand);font-weight:800}.settbtn{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--mute);display:grid;place-items:center;flex:none}
.tabs button[aria-pressed=true]{background:var(--brand);color:var(--on)}
.sr{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;background:var(--card);border:2px solid var(--line);border-radius:16px}
.sr input{flex:1;min-width:0;border:0;background:transparent;font-size:17px;outline:0}.sr:focus-within{border-color:var(--brand)}
.ch{display:flex;gap:8px;margin:12px -16px 0;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.c{flex:none;height:44px;padding:0 18px;border-radius:22px;border:2px solid var(--line);background:var(--card);font-weight:600}
.c[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on)}
.addc{width:100%;margin-top:12px;height:52px;border-radius:16px;border:2px dashed var(--brand);background:transparent;color:var(--brand);font-weight:800}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px;margin-top:18px}
.t{line-height:1.2;text-align:center;position:relative;background:var(--card);border:2px solid var(--line);border-radius:20px;height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:17px;padding:0 4px}
.t i{width:52px;height:52px;border-radius:50%;background:var(--c);color:#1d2a22;display:grid;place-items:center;font-style:normal;font-size:30px;line-height:1}
.t small{font-weight:400;color:var(--mute);font-size:13px}
.t.on{border-color:var(--brand);background:var(--sel)}
.b{position:absolute;top:-10px;right:-8px;min-width:34px;height:34px;border-radius:17px;background:var(--gold);color:var(--ongold);font-weight:800;font-size:18px;display:grid;place-items:center;padding:0 6px}
.m{position:absolute;top:-12px;left:-8px;width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:26px;line-height:1}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:480px;margin:0 auto;display:flex;gap:10px}
.go{flex:1;height:56px;border:0;border-radius:18px;background:var(--brand);color:var(--on);font-weight:800;font-size:18px}
.sq{width:56px;height:56px;border:0;border-radius:18px;display:grid;place-items:center;flex:none}
.wa{background:#25d366;color:#05260f}.cl{background:transparent;border:2px solid var(--line);color:var(--ink)}
.hint{color:var(--mute);font-size:15px;margin:10px 4px}
.pg{height:12px;border-radius:6px;background:var(--line);margin:6px 0;overflow:hidden}.pg div{height:100%;background:var(--gold);transition:width .3s}
.cap{display:flex;justify-content:space-between;color:var(--mute);font-size:15px;margin-bottom:12px}
.r{display:flex;align-items:center;gap:14px;min-height:76px;padding:8px 14px;background:var(--card);border:2px solid var(--line);border-radius:20px;margin-bottom:8px}
.k{width:44px;height:44px;border-radius:12px;border:3px solid var(--brand);display:grid;place-items:center;flex:none;background:transparent;color:var(--on);padding:0}
.r.done{background:transparent}.r.done .k{background:var(--brand)}.r.done .n{opacity:.6;text-decoration:line-through}
.n{flex:1;display:flex;flex-direction:column;line-height:1.25;min-width:0}.n b{font-size:21px}.n small{color:var(--mute);font-size:15px}
.t i svg,.ic svg,.top i svg{width:68%;height:68%}
.ic{width:40px;height:40px;border-radius:50%;background:#fde7b0;display:grid;place-items:center;font-style:normal;font-size:23px;line-height:1;flex:none}
.pr{width:90px;height:46px;border-radius:14px;border:2px dashed var(--line);background:var(--bg);text-align:center;font-weight:800;font-size:18px}
h3{margin:18px 4px 8px;font-size:15px;color:var(--mute);font-weight:600}
.tot{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:456px;margin:0 auto;background:var(--gold);color:var(--ongold);border-radius:24px;min-height:72px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px 8px 22px}
.tot small{display:block;font-size:14px}.tot b{font-size:28px}.tot button{height:50px;padding:0 20px;border:0;border-radius:16px;background:var(--ongold);color:#fff;font-weight:800}
.imp{margin-top:18px}textarea{width:100%;min-height:110px;padding:12px;border:2px solid var(--line);border-radius:14px;background:var(--card)}
.btn{height:52px;padding:0 18px;border-radius:16px;border:0;background:var(--brand);color:var(--on);font-weight:800}.btn.alt{background:transparent;border:2px solid var(--brand);color:var(--brand)}
.dim{position:fixed;inset:0;background:rgba(16,38,27,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sh{width:100%;max-width:480px;background:var(--card);border-radius:28px 28px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}@media (prefers-reduced-motion:reduce){.sh{animation:none}}
.hd{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.top{display:flex;align-items:center;gap:14px}.top i{width:56px;height:56px;border-radius:50%;background:var(--c);color:#1d2a22;display:grid;place-items:center;font-style:normal;font-size:32px;line-height:1}
.top b{font-size:26px}.top small{display:block;color:var(--mute);font-size:15px}
.big{display:flex;align-items:center;justify-content:space-between;background:var(--sel);border-radius:24px;padding:14px}
.big button{width:68px;height:68px;border-radius:50%;border:3px solid var(--brand);background:var(--brand);color:var(--on);font-size:38px;line-height:1}.big .mm{background:transparent;color:var(--brand)}
.big div{text-align:center;font-size:60px;font-weight:800;line-height:1}.big small{display:block;font-size:18px;font-weight:600;color:var(--mute);margin-top:4px}
.lb{font-size:15px;color:var(--mute);font-weight:600;margin-bottom:-6px}.rw{display:flex;gap:8px;flex-wrap:wrap}
.rm{background:none;border:0;color:var(--danger);font-weight:600;font-size:16px;height:44px}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:16px;z-index:9;max-width:90%;text-align:center}
[hidden]{display:none!important}
/* ===== SETTINGS PANEL ===== */
.sett-overlay{position:fixed;inset:0;background:rgba(16,38,27,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sett-sheet{width:100%;max-width:480px;background:var(--card);border-radius:28px 28px 0 0;padding:16px 20px calc(32px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;animation:up .22s ease-out}
.sett-hd{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.sett-title{font-size:20px;font-weight:800;margin:0 0 4px}
.sett-sub{font-size:14px;color:var(--mute);margin:0 0 18px}
.sett-section{font-size:13px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 10px;padding:0 2px}
.sett-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 10px;margin-bottom:4px}
.sett-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;background:var(--bg);border-radius:18px;border:2px solid var(--line);text-align:center;cursor:pointer;transition:border-color .15s,background .15s;user-select:none}
.sett-item.active{background:var(--sel);border-color:var(--brand)}
.sett-item i{width:46px;height:46px;border-radius:50%;background:var(--c,#fde7b0);display:grid;place-items:center;font-size:24px;line-height:1;color:#1d2a22}
.sett-item span{font-size:12px;font-weight:700;line-height:1.2;word-break:break-all}
.sett-badge{position:absolute;top:-8px;right:-6px;width:26px;height:26px;border-radius:50%;border:0;display:grid;place-items:center;font-size:18px;font-weight:800;cursor:pointer;z-index:1}
.sett-badge.rem{background:#e53935;color:#fff}
.sett-badge.add{background:#43a047;color:#fff}
.sett-divider{height:1px;background:var(--line);margin:16px -4px}

#pvd{z-index:4}
.pvs{max-height:90vh;gap:10px}
.pvs .hd{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 2px;flex:none}
.pvt{margin:0;font-size:22px;font-weight:800}.pvsub{margin:0;color:var(--mute);font-size:15px}
.pvl{overflow-y:auto;flex:1;min-height:0;margin:0 -8px;padding:0 8px;overscroll-behavior:contain}
.pvg{margin:12px 2px 6px;font-size:14px;font-weight:600;color:var(--mute)}
.pvr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.pvr .pi{width:40px;height:40px;border-radius:50%;background:var(--sel);display:grid;place-items:center;font-size:22px;line-height:1;flex:none;font-style:normal}
.pvr .pi svg{width:30px;height:30px}
.pvr .pn{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px 2px;min-height:48px;display:flex;flex-direction:column;justify-content:center;line-height:1.25}
.pvr .pn b{font-size:18px}.pvr .pn small{color:var(--mute);font-size:15px}
.pvr .st{display:flex;gap:6px;flex:none}
.pvr .st button,.pvr .px{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:22px;font-weight:800;display:grid;place-items:center;padding:0;flex:none}
.pvr .px{border-color:transparent;color:var(--danger);font-size:20px}
.pvf{display:flex;gap:8px;flex:none;padding-top:4px}
.pvf .btn{flex:1}.pvf .btn.send{flex:2}

.upd{position:fixed;top:0;left:0;right:0;z-index:8;background:var(--gold);color:var(--ongold);display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;font-weight:800;font-size:17px}
.upd span{flex:1;min-width:0}.upd button{min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--ongold);color:var(--gold);font-weight:800}
.upd button.x{background:transparent;color:var(--ongold);padding:0 10px;font-size:20px}
body.hasupd{padding-top:72px}
</style>
<meta name="theme-color" content="#1f6b4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="বাজার">

<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div class="upd" id="upd" hidden role="status"><span>নতুন আপডেট এসেছে</span><button id="updGo">এখনই নিন</button><button class="x" id="updX" aria-label="পরে">✕</button></div>
<div class="w">
<h1 id="h1">বাজারের তালিকা</h1>
<div class="tabs"><button id="t1" aria-pressed="true">তালিকা বানান</button><button id="t2" aria-pressed="false">বাজারে</button><button class="settbtn" id="settbtn" aria-label="সেটিং"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>
<!-- Settings Panel -->
<div class="sett-overlay" id="settPanel" hidden>
  <div class="sett-sheet" role="dialog" aria-modal="true" aria-label="পণ্য সেটিং">
    <div class="sett-hd"></div>
    <p class="sett-title">পণ্য ম্যানেজার</p>
    <p class="sett-sub">− চাপলে সরাবে · + চাপলে ফিরিয়ে আনবে</p>
    <p class="sett-section">চালু আছে</p>
    <div class="sett-grid" id="sett-active"></div>
    <div class="sett-divider"></div>
    <p class="sett-section">বাদ দেওয়া হয়েছে</p>
    <div class="sett-grid" id="sett-hidden"></div>
    <div class="sett-divider"></div>
    <p class="sett-section">অ্যাপের আপডেট</p>
    <p class="sett-sub" id="verTxt">ভার্সন —</p>
    <button class="btn alt" id="updBtn" style="width:100%">আপডেট খুঁজুন</button>
    <p class="sett-sub" id="updMsg" aria-live="polite" style="min-height:1.4em"></p>
    <button class="btn" id="settClose" style="width:100%;margin-top:20px">সম্পন্ন</button>
  </div>
</div>

<section id="v1">
  <label class="sr"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="জিনিস খুঁজুন বা নতুন লিখুন" autocomplete="off"></label>
  <div id="addc"></div>
  <div id="lastb"></div>
  <div class="ch" id="chips"></div>
  <p class="hint">ছবিতে ট্যাপ করলে যোগ হবে। আবার ট্যাপ করলে পরিমাণ ও একক বদলানো যাবে।</p>
  <div id="reg"></div>
  <div class="g" id="grid"></div>
</section>

<section id="v2" hidden>
  <div id="shop"></div>
  <div class="imp" id="imp" hidden>
    <h3>অন্যের পাঠানো তালিকা</h3>
    <textarea id="paste" aria-label="পাঠানো তালিকা" placeholder="এখানে তালিকা পেস্ট করুন"></textarea>
    <div style="display:flex;gap:8px;margin-top:8px"><button class="btn" id="load">তালিকা খুলুন</button><button class="btn alt" id="mine">আমার তালিকা নিন</button></div>
  </div>
</section>
</div>

<div class="bar" id="bar1"><div><button class="go" id="gob">বাজারে যান · <span id="cnt">০</span>টি<span id="est" style="display:block;font-size:13px;font-weight:600;line-height:1.1"></span></button><button class="sq wa" id="share" aria-label="WhatsApp-এ পাঠান"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg></button><button class="sq cl" id="clr" aria-label="সব মুছুন"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button></div></div>
<div id="tot" class="tot" hidden></div>
<div class="dim" id="pvd" hidden><div class="sh pvs" id="pv" role="dialog" aria-modal="true" aria-label="পাঠানোর আগে তালিকা দেখুন"></div></div>
<div class="dim" id="dim" hidden><div class="sh" id="sh" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
var BN="০১২৩৪৫৬৭৮৯";
function $(i){return document.getElementById(i)}
function bn(n){return String(n).replace(/\d/g,function(d){return BN[d]})}
function qtxt(q){var w=Math.floor(q),f=+(q-w).toFixed(2);if(f===0)return bn(w);if(f===0.5)return(w?bn(w):"")+"½";return bn(q)}

  if(!swReg){if(manual)setUpd("এই ব্রাউজারে আপডেট সুবিধা নেই");return}
  if(!navigator.onLine){if(manual)setUpd("নেট নেই — নেট এলে আবার চেষ্টা করুন");return}
  if(manual)setUpd("খোঁজা হচ্ছে…");
  lastCheck=Date.now();
  swReg.update().then(function(){
    if(swReg.waiting)showUpd();
    else if(swReg.installing){if(manual)setUpd("নতুন ভার্সন নামছে…")}
    else if(manual)setUpd("আপনি সর্বশেষ ভার্সনেই আছেন ✓")
  }).catch(function(){if(manual)setUpd("খোঁজা যায়নি, একটু পরে চেষ্টা করুন")})}
if("serviceWorker"in navigator){
  navigator.serviceWorker.addEventListener("message",function(e){var d=e.data||{};if(d.type==="VERSION"){var n=String(d.v).replace(/\D/g,"");$("verTxt").textContent="ভার্সন "+(n?bn(n):"—")}});
  navigator.serviceWorker.addEventListener("controllerchange",function(){if(reloading)location.reload()});
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      swReg=reg;
      if(reg.waiting&&navigator.serviceWorker.controller)showUpd();
      reg.addEventListener("updatefound",function(){var w=reg.installing;if(!w)return;
        w.addEventListener("statechange",function(){if(w.state==="installed"&&navigator.serviceWorker.controller)showUpd()})});
      navigator.serviceWorker.ready.then(askVersion);
      checkUpdate(false)
    }).catch(function(){})});
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&Date.now()-lastCheck>300000)checkUpdate(false)});
  $("updGo").onclick=function(){reloading=true;if(swReg&&swReg.waiting)swReg.waiting.postMessage({type:"SKIP_WAITING"});else location.reload()};
  $("updX").onclick=function(){$("upd").hidden=true;document.body.classList.remove("hasupd")};
  $("updBtn").onclick=function(){checkUpdate(true)};
  $("settbtn").addEventListener("click",askVersion)
}else{var vb=$("updBtn");if(vb)vb.onclick=function(){setUpd("এই ব্রাউজারে আপডেট সুবিধা নেই")}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
</script>
</body>
